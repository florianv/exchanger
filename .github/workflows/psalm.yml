name: Psalm

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  psalm:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      - name: Run Psalm
        run: vendor/bin/psalm --no-progress

  baseline:
    name: Psalm baseline does not grow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # The pull_request checkout is a merge commit; its first parent is the base branch tip.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Compares the total number of entries, so regenerated or renamed entries do not count as new.
      - name: Compare baseline entry counts
        run: |
          set -euo pipefail
          count() { { grep -o '<code>' || true; } | wc -l | tr -d ' '; }
          before=$(git show HEAD^1:psalm-baseline.xml | count)
          after=$(count < psalm-baseline.xml)
          echo "psalm-baseline.xml entries: $before before, $after after"
          if [ "$after" -gt "$before" ]; then
            echo "::error file=psalm-baseline.xml::This PR adds $((after - before)) suppressed Psalm issue(s) to psalm-baseline.xml. Fix the issues in code; run 'composer psalm' locally to see them. If an entry is unavoidable, explain why in the PR description."
            exit 1
          fi
